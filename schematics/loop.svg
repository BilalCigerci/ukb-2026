<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1380" width="1300" height="1380" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>UKB Main Loop</title>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.4" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="var(--edge)"/>
    </marker>

    <style><![CDATA[
      /* Fixed dark theme: an SVG embedded via <img> on GitHub sees the operating
         system's appearance setting, not the page's, so prefers-color-scheme is not used. */
      svg {
        --bg:#0d1117;
        --t1:#e6edf3; --t2:#9aa7b4; --edge:#6e7b8a;
        --hwB:#12161c; --hwS:#2b3138; --hwL:#8b96a3; --hwC:#4a545f;
        --drB:#0b1620; --drS:#1b3a56; --drL:#6cb6ff; --drC:#2d6da8;
        --daB:#1a1408; --daS:#4d3a12; --daL:#d9a441; --daC:#8a6a1e;
        --esB:#0b1a11; --esS:#1c3f29; --esL:#5fd68a; --esC:#2f7a4d;
        --esN:#122a1b;
      }

      .band  { stroke-width: 1.2; }
      .bl    { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      .ml    { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; }
      .node  { stroke-width: 1.5; }
      .cond  { stroke-dasharray: 6 4; }
      .t1    { font-size: 15px;   font-weight: 650; fill: var(--t1); }
      .t2    { font-size: 12.5px; font-weight: 400; fill: var(--t2); }
      .t3    { font-size: 11px;   font-weight: 400; fill: var(--t2); }
      .mono  { font-size: 12px; font-weight: 500; fill: var(--t1);
               font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .num   { font-size: 12.5px; font-weight: 700; fill: var(--bg); }
      .edge  { fill: none; stroke: var(--edge); stroke-width: 1.8;
               stroke-linecap: round; stroke-linejoin: round; marker-end: url(#ar); }
      .line  { fill: none; stroke: var(--edge); stroke-width: 1.8;
               stroke-linecap: round; stroke-linejoin: round; }
      .dash  { stroke-dasharray: 6 5; }
    ]]></style>
  </defs>

  <rect width="1300" height="1380" fill="var(--bg)"/>

  <!-- ═══════════ FRAMES ═══════════ -->
  <text class="bl" x="82" y="50"   fill="var(--hwL)">Interrupts</text>
  <rect class="band" x="80" y="60"   width="1180" height="112" rx="12" fill="var(--hwB)" stroke="var(--hwS)"/>

  <text class="bl" x="82" y="204"  fill="var(--drL)">Every iteration · super loop</text>
  <rect class="band" x="80" y="214"  width="1180" height="276" rx="12" fill="var(--drB)" stroke="var(--drS)"/>

  <text class="bl" x="82" y="524"  fill="var(--esL)">Every 100 ms · on TIM2 flag (10 Hz) · per mode</text>
  <rect class="band" x="80" y="534"  width="1180" height="536" rx="12" fill="var(--esB)" stroke="var(--esS)"/>

  <text class="bl" x="82" y="1104" fill="var(--daL)">Every 100 ms · in all modes</text>
  <rect class="band" x="80" y="1114" width="1180" height="166" rx="12" fill="var(--daB)" stroke="var(--daS)"/>

  <!-- ═══════════ CONNECTIONS ═══════════ -->

  <!-- Interrupt flags -->
  <path class="edge dash" d="M345,152 L345,252"/>
  <path class="edge dash" d="M670,152 L670,368"/>
  <path class="edge dash" d="M1105,152 L1105,238"/>

  <!-- 1 → 2 → 3 → 4 → 5 → decision -->
  <path class="edge" d="M364,290 L394,290"/>
  <path class="edge" d="M654,290 L684,290"/>
  <path class="edge" d="M944,290 L974,290"/>
  <path class="edge" d="M1105,340 L1105,362"/>
  <path class="edge" d="M976,414 L782,414"/>

  <!-- no → 1 -->
  <path class="edge" d="M558,414 L247,414 Q235,414 235,402 L235,328"/>
  <text class="t2" x="540" y="405" text-anchor="end">no</text>

  <!-- yes → switch -->
  <path class="edge" d="M670,458 L670,556"/>
  <text class="t2" x="682" y="512">yes</text>

  <!-- switch → branches -->
  <path class="edge" d="M670,598 L670,620"/>
  <path class="edge" d="M560,578 L298,578 Q286,578 286,590 L286,620"/>
  <path class="edge" d="M780,578 L1042,578 Q1054,578 1054,590 L1054,620"/>

  <!-- inside branches -->
  <path class="edge" d="M286,732 L286,750"/>

  <path class="edge" d="M670,732 L670,750"/>
  <path class="edge" d="M670,800 L670,818"/>

  <path class="edge" d="M1054,732 L1054,750"/>
  <path class="edge" d="M1054,800 L1054,818"/>
  <path class="edge" d="M1054,868 L1054,886"/>
  <path class="edge" d="M1054,936 L1054,954"/>

  <!-- branches → 7 -->
  <path class="edge" d="M286,800 L286,1032 Q286,1044 298,1044 L388,1044 Q400,1044 400,1056 L400,1136"/>
  <path class="line" d="M670,868 L670,1032 Q670,1044 658,1044 L400,1044"/>
  <path class="line" d="M1054,1004 L1054,1032 Q1054,1044 1042,1044 L670,1044"/>

  <!-- 7 → 8 → 9 -->
  <path class="edge" d="M466,1196 L488,1196"/>
  <path class="edge" d="M850,1196 L872,1196"/>

  <!-- 9 → 1 (next iteration) -->
  <path class="edge" d="M1054,1254 L1054,1290 Q1054,1302 1042,1302 L57,1302 Q45,1302 45,1290 L45,302 Q45,290 57,290 L104,290"/>
  <text class="t3" x="670" y="1320" text-anchor="middle">next iteration → 1</text>

  <!-- ═══════════ INTERRUPTS ═══════════ -->
  <rect class="node" x="110" y="80" width="350" height="72" rx="9" fill="var(--bg)" stroke="var(--hwC)"/>
  <text class="t1" x="285" y="111" text-anchor="middle">BMP390 · BMI088 EXTI</text>
  <text class="t2" x="285" y="131" text-anchor="middle">data-ready → update flags</text>

  <rect class="node" x="500" y="80" width="350" height="72" rx="9" fill="var(--bg)" stroke="var(--hwC)"/>
  <text class="t1" x="675" y="111" text-anchor="middle">TIM2</text>
  <text class="t2" x="675" y="131" text-anchor="middle">100 ms → timer_flag_100ms</text>

  <rect class="node" x="890" y="80" width="350" height="72" rx="9" fill="var(--bg)" stroke="var(--hwC)"/>
  <text class="t1" x="1065" y="111" text-anchor="middle">USART2-3 + DMA</text>
  <text class="t2" x="1065" y="131" text-anchor="middle">incoming packet is buffered</text>

  <!-- ═══════════ EVERY ITERATION ═══════════ -->
  <rect class="node" x="106" y="254" width="258" height="72" rx="9" fill="var(--bg)" stroke="var(--drC)"/>
  <circle cx="130" cy="280" r="13" fill="var(--drL)"/>
  <text class="num" x="130" y="284.5" text-anchor="middle">1</text>
  <text class="t1" x="152" y="285">Sensor read</text>
  <text class="mono" x="122" y="310">BMP390/BMI088_Update</text>

  <rect class="node" x="396" y="254" width="258" height="72" rx="9" fill="var(--bg)" stroke="var(--drC)"/>
  <circle cx="420" cy="280" r="13" fill="var(--drL)"/>
  <text class="num" x="420" y="284.5" text-anchor="middle">2</text>
  <text class="t1" x="442" y="285">Raw data</text>
  <text class="mono" x="412" y="310">DataManager_UpdateFlightData</text>

  <rect class="node" x="686" y="254" width="258" height="72" rx="9" fill="var(--bg)" stroke="var(--drC)"/>
  <circle cx="710" cy="280" r="13" fill="var(--drL)"/>
  <text class="num" x="710" y="284.5" text-anchor="middle">3</text>
  <text class="t1" x="732" y="285">Attitude</text>
  <text class="mono" x="702" y="310">SensorFusion_QuaternionUpdate</text>

  <rect class="node" x="976" y="240" width="258" height="100" rx="9" fill="var(--bg)" stroke="var(--drC)"/>
  <circle cx="1000" cy="266" r="13" fill="var(--drL)"/>
  <text class="num" x="1000" y="270.5" text-anchor="middle">4</text>
  <text class="t1" x="1022" y="271">UART packet</text>
  <text class="mono" x="992" y="296">UartHandler_ProcessPacket</text>
  <text class="t3" x="992" y="315">parse SIT / SUT / command packet</text>

  <rect class="node cond" x="976" y="364" width="258" height="100" rx="9" fill="var(--bg)" stroke="var(--drC)"/>
  <circle cx="1000" cy="390" r="13" fill="var(--drL)"/>
  <text class="num" x="1000" y="394.5" text-anchor="middle">5</text>
  <text class="t1" x="1022" y="395">Command reset</text>
  <text class="mono" x="992" y="419">FlightAlgorithm_Reset</text>
  <text class="mono" x="992" y="436">KalmanFilter_Reset</text>
  <text class="t3" x="992" y="454">only if a command packet arrived</text>

  <path class="node" d="M670,370 L780,414 L670,458 L560,414 Z" fill="var(--bg)" stroke="var(--drC)"/>
  <text class="mono" x="670" y="410" text-anchor="middle">timer_flag_100ms</text>
  <text class="t2" x="670" y="428" text-anchor="middle">set?</text>

  <!-- ═══════════ EVERY 100 ms · PER MODE ═══════════ -->
  <rect class="node" x="560" y="558" width="220" height="40" rx="20" fill="var(--bg)" stroke="var(--esC)"/>
  <circle cx="584" cy="578" r="12" fill="var(--esL)"/>
  <text class="num" x="584" y="582.5" text-anchor="middle">6</text>
  <text class="mono" x="682" y="582.5" text-anchor="middle">switch (system_mode)</text>

  <!-- NORMAL -->
  <rect class="node" x="106" y="622" width="360" height="396" rx="10" fill="var(--bg)" stroke="var(--esC)"/>
  <text class="ml" x="286" y="652" text-anchor="middle" fill="var(--esL)">NORMAL_MODE</text>
  <text class="t3" x="286" y="670" text-anchor="middle">real flight</text>

  <rect x="126" y="684" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="142" y="704">SensorFusion_KalmanUpdate</text>
  <text class="t3" x="142" y="721">sensor_check → Kalman (h, v, a) → filtered</text>

  <rect x="126" y="752" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="142" y="772">FlightAlgorithm_Update</text>
  <text class="t3" x="142" y="789">theta_check · phase state machine · recovery</text>

  <!-- SIT -->
  <rect class="node" x="490" y="622" width="360" height="396" rx="10" fill="var(--bg)" stroke="var(--esC)"/>
  <text class="ml" x="670" y="652" text-anchor="middle" fill="var(--esL)">SIT_MODE</text>
  <text class="t3" x="670" y="670" text-anchor="middle">sensor monitoring test</text>

  <rect x="510" y="684" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="526" y="704">SensorFusion_KalmanUpdate</text>
  <text class="t3" x="526" y="721">sensor_check → Kalman (h, v, a) → filtered</text>

  <rect x="510" y="752" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="526" y="772">DataManager_UpdateSitPacket</text>
  <text class="t3" x="526" y="789">write sensor data into the SIT packet</text>

  <rect x="510" y="820" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="526" y="840">UartHandler_SendSitPacket</text>
  <text class="t3" x="526" y="857">send the packet over USART</text>

  <!-- SUT -->
  <rect class="node" x="874" y="622" width="360" height="396" rx="10" fill="var(--bg)" stroke="var(--esC)"/>
  <text class="ml" x="1054" y="652" text-anchor="middle" fill="var(--esL)">SUT_MODE</text>
  <text class="t3" x="1054" y="670" text-anchor="middle">flight algorithm test with simulated data</text>

  <rect x="894" y="684" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="910" y="704" style="font-size:11px">DataManager_UpdateFlightDataWithSutPacket</text>
  <text class="t3" x="910" y="721">write simulation data into FlightData</text>

  <rect x="894" y="752" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="910" y="772">SensorFusion_KalmanUpdate</text>
  <text class="t3" x="910" y="789">sensor_check → Kalman (h, v, a) → filtered</text>

  <rect x="894" y="820" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="910" y="840">FlightAlgorithm_Update</text>
  <text class="t3" x="910" y="857">theta_check · phase state machine · recovery</text>

  <rect x="894" y="888" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="910" y="908">DataManager_UpdateSutStatePacket</text>
  <text class="t3" x="910" y="925">copy state bits into the UART packet</text>

  <rect x="894" y="956" width="320" height="48" rx="7" fill="var(--esN)" stroke="var(--esC)" stroke-width="1.2"/>
  <text class="mono" x="910" y="976">UartHandler_SendSutStatePacket</text>
  <text class="t3" x="910" y="993">send the packet over USART</text>

  <!-- ═══════════ LOGGING ═══════════ -->
  <rect class="node" x="106" y="1138" width="360" height="116" rx="9" fill="var(--bg)" stroke="var(--daC)"/>
  <circle cx="130" cy="1164" r="13" fill="var(--daL)"/>
  <text class="num" x="130" y="1168.5" text-anchor="middle">7</text>
  <text class="t1" x="152" y="1169">Flash commands</text>
  <text class="mono" x="122" y="1194">W25Q_CommandHandler</text>
  <text class="t3" x="122" y="1213">read · erase · usage query</text>

  <rect class="node" x="490" y="1138" width="360" height="116" rx="9" fill="var(--bg)" stroke="var(--daC)"/>
  <circle cx="514" cy="1164" r="13" fill="var(--daL)"/>
  <text class="num" x="514" y="1168.5" text-anchor="middle">8</text>
  <text class="t1" x="536" y="1169">Flash logging</text>
  <text class="mono" x="506" y="1194">W25Q_Flash_LogData</text>
  <text class="t3" x="506" y="1213">10 Hz in flight · 1 Hz in IDLE and LANDED</text>

  <rect class="node" x="874" y="1138" width="360" height="116" rx="9" fill="var(--bg)" stroke="var(--daC)"/>
  <circle cx="898" cy="1164" r="13" fill="var(--daL)"/>
  <text class="num" x="898" y="1168.5" text-anchor="middle">9</text>
  <text class="t1" x="920" y="1169">Backup SRAM</text>
  <text class="mono" x="890" y="1194">DataManager_UpdateBKPSRAMPacket</text>
  <text class="mono" x="890" y="1211">BackupDomain_WriteSRAM</text>
  <text class="t3" x="890" y="1229">flight state backup: altitude · velocity · accel · attitude</text>
  <text class="t3" x="890" y="1245">phase · counters · flash position → restored after reset</text>

  <!-- ═══════════ LEGEND ═══════════ -->
  <path class="edge" d="M110,1356 L158,1356"/>
  <text class="t3" x="168" y="1360">sequential step</text>
  <path class="edge dash" d="M270,1356 L318,1356"/>
  <text class="t3" x="328" y="1360">interrupt flag</text>
  <rect class="node cond" x="440" y="1346" width="48" height="20" rx="5" fill="var(--bg)" stroke="var(--drC)"/>
  <text class="t3" x="498" y="1360">conditional step</text>
</svg>
